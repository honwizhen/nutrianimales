# postgresql.conf - NutriAnimales S.A. (BCD 9220)
listen_addresses = '*'          # solo alcanzable dentro de nutrianimales-net (sin ports: en compose)
max_connections = 100

# --- TLS ---
ssl = on
ssl_cert_file = '/etc/postgresql/certs/server.crt'
ssl_key_file = '/etc/postgresql/certs/server.key'
ssl_min_protocol_version = 'TLSv1.2'

# --- Autenticacion ---
password_encryption = scram-sha-256

# --- Monitoreo ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
log_min_duration_statement = 1000   # ms, alerta R1 (consultas > 1 seg)

# --- Logs de auditoria ---
log_connections = on
log_disconnections = on
log_statement = 'ddl'
log_line_prefix = '%m [%p] %q%u@%d %h '
